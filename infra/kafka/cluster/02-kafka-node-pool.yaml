apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: nodepool
  namespace: kafka
  labels:
    strimzi.io/cluster: lab-cluster
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: true