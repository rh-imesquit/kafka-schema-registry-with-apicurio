# =========================================================
# 1. IDENTIFICAÇÃO E TARGET NAMESPACE
# =========================================================
quarkus.kubernetes.name=music-consumer
quarkus.kubernetes.namespace=apps
quarkus.openshift.expose=true

# =========================================================
# 2. ESTRATÉGIA DE BUILD (OCP BINARY BUILD)
# =========================================================
quarkus.container-image.builder=openshift
quarkus.container-image.name=music-consumer
quarkus.container-image.group=apps
quarkus.container-image.tag=1.0.0-SNAPSHOT

quarkus.openshift.build-strategy=binary
quarkus.kubernetes.image-pull-policy=Always
quarkus.kubernetes-client.trust-certs=true

quarkus.s2i.base-jvm-image=registry.access.redhat.com/ubi8/openjdk-17:1.20

# =========================================================
# 3. VARIÁVEIS DE AMBIENTE (CROSS-NAMESPACE)
# =========================================================
quarkus.openshift.env.vars.KAFKA_BOOTSTRAP_SERVERS=cluster-lab-kafka-bootstrap.kafka.svc.cluster.local:9092
quarkus.openshift.env.vars.REGISTRY_URL=http://apicurio-lab-app-service.apicurio.svc.cluster.local:8080

# =========================================================
# 4. CONFIGURAÇÃO DO KAFKA (SMALLRYE MESSAGING)
# =========================================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# Canal de Entrada (Incoming)
mp.messaging.incoming.music-in.connector=smallrye-kafka
mp.messaging.incoming.music-in.topic=music
mp.messaging.incoming.music-in.value.deserializer=io.apicurio.registry.serde.avro.AvroKafkaDeserializer

# Define o grupo do consumer (obrigatório para Kafka)
mp.messaging.incoming.music-in.group.id=music-consumer-group

# Política de offset: latest (só mensagens novas) ou earliest (desde o início)
mp.messaging.incoming.music-in.auto.offset.reset=earliest

# =========================================================
# 5. CONFIGURAÇÃO APICURIO REGISTRY 3
# =========================================================
mp.messaging.incoming.music-in.apicurio.registry.url=${REGISTRY_URL}

# Informa ao deserializador qual classe Avro usar para fazer o bind
mp.messaging.incoming.music-in.apicurio.registry.use-specific-avro-reader=true

# Estratégia de ID de Artefato: deve bater com a usada no producer
mp.messaging.incoming.music-in.apicurio.registry.artifact-id=io.apicurio.registry.serde.strategy.TopicIdStrategy