quarkus.kubernetes.name=music-producer
quarkus.kubernetes.namespace=apps
quarkus.openshift.expose=true

quarkus.container-image.builder=openshift
quarkus.container-image.name=music-producer
quarkus.container-image.group=apps
quarkus.container-image.tag=1.0.0-SNAPSHOT

quarkus.openshift.build-strategy=binary
quarkus.kubernetes.image-pull-policy=Always
quarkus.kubernetes-client.trust-certs=true

quarkus.s2i.base-jvm-image=registry.access.redhat.com/ubi8/openjdk-17:1.20

quarkus.openshift.env.vars.KAFKA_BOOTSTRAP_SERVERS=cluster-lab-kafka-bootstrap.kafka.svc.cluster.local:9092
quarkus.openshift.env.vars.REGISTRY_URL=http://apicurio-lab-app-service.apicurio.svc.cluster.local:8080

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
mp.messaging.outgoing.music-out.connector=smallrye-kafka
mp.messaging.outgoing.music-out.topic=music
mp.messaging.outgoing.music-out.value.serializer=io.apicurio.registry.serde.avro.AvroKafkaSerializer

mp.messaging.outgoing.music-out.apicurio.registry.url=${REGISTRY_URL}
mp.messaging.outgoing.music-out.apicurio.registry.auto-register=true
mp.messaging.outgoing.music-out.apicurio.registry.find-latest=true
mp.messaging.outgoing.music-out.apicurio.registry.artifact-id=io.apicurio.registry.serde.strategy.TopicIdStrategy